<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de evamorgelio | Sintux Studios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #2E004F;
            --accent-bright: #9b59b6;
            --accent-glow: rgba(155, 89, 182, 0.45);
            --card-bg: rgba(17, 17, 22, 0.78);
            --border-subtle: rgba(255, 255, 255, 0.12);
            --text-muted: #b8c0cc;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        .background-img {
            position: fixed;
            top: -10px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            background-image: url('../FMedias/fondo5.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 10, 0.6);
            z-index: -1;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .perfil-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 35px rgba(155, 89, 182, 0.16);
            animation: cardFadeIn 0.45s ease-out both;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .star-top-right {
            position: absolute;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .star-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 1.15rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .star-btn:hover {
            transform: scale(1.08);
            color: #ffffff;
            border-color: var(--accent-bright);
        }

        .star-btn.active {
            color: #ffffff;
            background: var(--accent-bright);
            border-color: var(--accent-bright);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .star-count {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            line-height: 1;
        }

        .star-btn.active + .star-count {
            color: #ffffff;
        }

        .avatar-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 18px;
        }

        .perfil-img {
            width: 146px;
            height: 146px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border: 4px solid var(--accent-bright);
            box-shadow: 0 0 25px var(--accent-glow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .perfil-img:hover {
            transform: scale(1.04);
            box-shadow: 0 0 34px var(--accent-glow);
        }

        .badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #e4c6ff;
            background: rgba(155, 89, 182, 0.22);
            border: 1px solid rgba(155, 89, 182, 0.45);
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.05rem;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.96rem;
            line-height: 1.55;
            margin: 0 0 26px 0;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 22px 0 28px 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .social-links a {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1.25rem;
            text-decoration: none;
            transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .social-links a:hover {
            transform: translateY(-3px);
            color: #ffffff;
            background: var(--accent-bright);
            border-color: var(--accent-bright);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .social-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.14);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(155, 89, 182, 0.22);
            border-color: var(--accent-bright);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="background-img"></div>
    <div class="overlay"></div>

    <div class="main-content">
        <div class="perfil-card">
            <div class="star-top-right">
                <button type="button" class="star-btn" id="star-btn" aria-label="Votar por evamorgelio">
                    <i class="far fa-star" id="star-icon"></i>
                </button>
                <span class="star-count" id="star-count">0</span>
            </div>

            <div class="avatar-wrapper">
                <img src="../LMedias/media5.png" alt="evamorgelio" class="perfil-img">
            </div>

            <span class="badge">Sintux Medias</span>
            <h1>evamorgelio</h1>
            <p class="bio">Aquí no se viene a sobrevivir, se viene a dominar. PvP y proyectos en Sintux Studios.</p>

            <div class="social-links">
                <a href="https://www.youtube.com/@evamorgelio1599" target="_blank" rel="noopener noreferrer" title="YouTube" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://www.instagram.com/bryanmora897" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://x.com/Evamorgelio" target="_blank" rel="noopener noreferrer" title="X" aria-label="X">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
            </div>

            <a href="../../index.html" class="back-btn">← Volver al inicio</a>
        </div>
    </div>

    <script>
        (function() {
            const keyCount = "sintux_stars_evamorgelio_count";
            const keyVoted = "sintux_stars_evamorgelio_voted";
            const btn = document.getElementById("star-btn");
            const icon = document.getElementById("star-icon");
            const countEl = document.getElementById("star-count");

            let count = Number(localStorage.getItem(keyCount)) || 0;
            let voted = localStorage.getItem(keyVoted) === "true";

            function render() {
                countEl.textContent = count.toLocaleString("es-ES");
                btn.classList.toggle("active", voted);
                icon.className = voted ? "fas fa-star" : "far fa-star";
            }

            btn.addEventListener("click", () => {
                voted = !voted;
                count = voted ? count + 1 : Math.max(0, count - 1);
                localStorage.setItem(keyCount, String(count));
                localStorage.setItem(keyVoted, String(voted));
                render();
            });

            render();
        })();
    </script>

</body>
</html>
